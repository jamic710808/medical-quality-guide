materials:{title:"資料現狀",icon:"▦",description:"瞭解溝通記錄中描述的資料分佈、更新方式和已知缺口。"},
questions:{title:"待確認事項",icon:"⊙",description:"把尚未明確的問題帶到下一次溝通，逐項補齊依據。"}
};
const STATUSES={unreviewed:"未審閱",aligned:"已對齊",revise:"需修改",discuss:"待討論"};
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byId=new Map(DATA.items.map(i=>[i.id,i]));
const byRef=new Map(DATA.documents.flatMap(d=>d.sections.map(s=>[s.id,{document:d,section:s}])));
const storageKey="requirements-review:"+DATA.project.id+":"+DATA.revision;
const RELATIONSHIPS=DATA.relationships||[];
const requirements=DATA.items.filter(i=>i.category==="requirements");
const state={view:"threads",threadId:requirements[0]?.id||null,query:"",filter:"all",selected:null,reviews:{},storageAvailable:true};
let toastTimer;
function notify(message){$("toast").textContent=message;$("toast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2800)}
try{
 const raw=localStorage.getItem(storageKey), saved=raw?JSON.parse(raw):null;
 if(saved&&saved.revision===DATA.revision&&saved.project===DATA.project.id){
  for(const [id,r] of Object.entries(saved.reviews||{})){
   if(byId.has(id)&&r&&Object.hasOwn(STATUSES,r.status)&&typeof r.comment==="string"){
    state.reviews[id]={status:r.status,comment:r.comment.slice(0,5000),updated_at:typeof r.updated_at==="string"?r.updated_at:""};
   }
  }
 }
}catch{state.storageAvailable=false}
function saveReviews(){
 try{localStorage.setItem(storageKey,JSON.stringify({project:DATA.project.id,revision:DATA.revision,reviews:state.reviews}));state.storageAvailable=true}
 catch{state.storageAvailable=false}
 $("save-message").textContent=state.storageAvailable?"已保存到本機":"無法保存，請導出意見";
 $("save-message").classList.toggle("warning",!state.storageAvailable);
}
function currentReview(id){return state.reviews[id]||{status:"unreviewed",comment:"",updated_at:""}}
function statusColor(status){return status==="aligned"?"green":status==="revise"?"red":status==="discuss"?"amber":""}
function statusBadge(id){const r=currentReview(id);return '<span class="badge '+statusColor(r.status)+'">'+STATUSES[r.status]+'</span>'}
function originBadge(item){return '<span class="badge '+(item.origin==="整理建議，待確認"?"amber":"")+'">'+esc(item.origin)+'</span>'}
function count(category){return DATA.items.filter(i=>i.category===(category==="threads"?"requirements":category)).length}
function renderNavigation(){
 $("navigation").innerHTML=Object.entries(CATEGORIES).map(([key,value])=>'<button class="nav-btn '+(state.view===key?"active":"")+'" data-view="'+key+'" '+(state.view===key?'aria-current="page"':"")+'><span class="nav-icon" aria-hidden="true">'+value.icon+'</span>'+value.title+(key==="overview"?"":'<span class="nav-count">'+count(key)+'</span>')+'</button>').join("");
 $("breadcrumb").textContent=CATEGORIES[state.view].title;
}
function heading(title,description,tag){
 return '<div class="page-heading"><div><div class="eyebrow">需求與業務約定 · 審閱版</div><h1>'+esc(title)+'</h1><p>'+esc(description)+'</p></div><span class="badge green heading-badge">'+esc(tag)+'</span></div>';
}
function edgesFor(id,category=null){
 return RELATIONSHIPS.filter(e=>e.requirement===id&&(!category||byId.get(e.target).category===category));
}
function relatedRequirements(itemId){
 const ids=new Set(RELATIONSHIPS.filter(e=>e.target===itemId).map(e=>e.requirement));
 if(byId.get(itemId)?.category==="requirements")ids.add(itemId);
 return requirements.filter(r=>ids.has(r.id));
}
function threadDocuments(id){
 const item=byId.get(id);if(!item)return [];
 const refs=new Set([...item.references,...edgesFor(id).flatMap(e=>e.references)]);
 return DATA.documents.map(d=>({document:d,sections:d.sections.filter(s=>refs.has(s.id))})).filter(group=>group.sections.length);
}
function threadLinks(items,label="相關需求"){
 if(!items.length)return '<div class="related-threads"><span>尚未建立與具體需求的關聯。</span></div>';
 return '<div class="related-threads"><span>'+esc(label)+'</span>'+items.map(i=>'<button class="thread-link" data-thread="'+i.id+'">'+esc(i.title)+' ↗</button>').join("")+'</div>';
}
function relationCard(edge){
 const item=byId.get(edge.target);
 return '<div class="relation-card" data-related-item="'+item.id+'">'+(item.date?'<time class="relation-date">'+esc(item.date)+'</time>':"")+'<div class="relation-card-head"><button class="relation-title" data-thread-item="'+item.id+'">'+esc(item.title)+' ↗</button>'+statusBadge(item.id)+'</div><p class="relation-reason">'+esc(edge.reason)+'</p><div class="ref-list">'+edge.references.map(ref=>'<button class="ref" data-ref="'+esc(ref)+'" title="查看關聯依據">'+esc(ref)+'</button>').join("")+'</div></div>';
}
function relationGroup(id,category,empty){
 let edges=edgesFor(id,category);
 if(category==="communications")edges=edges.slice().sort((a,b)=>(byId.get(a.target).date||"").localeCompare(byId.get(b.target).date||""));
 return edges.length?edges.map(relationCard).join(""):'<div class="thread-empty">'+esc(empty)+'</div>';
}
function renderThread(){
 const req=byId.get(state.threadId);
 if(!req){$("main").innerHTML=heading("需求關聯",CATEGORIES.threads.description,"暫無需求")+'<div class="empty">當前資料尚未提煉可關聯的需求。</div>';return}
 const groups=threadDocuments(req.id),edges=edgesFor(req.id);
 const scope=[req,...edges.map(e=>byId.get(e.target))],reviewed=scope.filter(i=>currentReview(i.id).status!=="unreviewed").length;
 $("main").innerHTML=heading("圍繞一條需求，把事情串起來",DATA.project.title+" · 文件說明來由，約定限定邊界，溝通與問題接著往下看。","資料截止 "+DATA.project.as_of)+
 '<div class="thread-tabs" aria-label="選擇需求">'+requirements.map((i,n)=>'<button class="thread-tab '+(i.id===req.id?"active":"")+'" data-thread="'+i.id+'" aria-pressed="'+(i.id===req.id)+'"><span class="mono">需求 '+String(n+1).padStart(2,"0")+'</span><strong>'+esc(i.title)+'</strong>'+statusBadge(i.id)+'</button>').join("")+'</div>'+
 '<div class="thread-context"><strong id="active-thread-name">當前需求：'+esc(req.title)+'</strong><span>'+groups.length+' 份對應文件 · '+edges.length+' 個關聯事項 · 已審閱 '+reviewed+' / '+scope.length+' 項</span></div>'+
 '<div class="thread-map"><section class="thread-column sources"><h2>對應文件 <span class="badge">'+groups.length+'</span></h2>'+
 groups.map(g=>'<div class="thread-source-file"><span class="badge">'+esc(g.document.type)+'</span><button class="file-button" data-thread-doc="'+esc(g.document.id)+'">'+esc(g.document.filename||g.document.title)+'</button><div class="source-line"><span>'+g.sections.length+' 個關聯條目</span><button data-thread-doc="'+esc(g.document.id)+'">查看依據 ↗</button></div></div>').join("")+
 '</section><section class="thread-column focus"><h2>這條需求要做到什麼</h2><div class="requirement-node"><div class="card-meta">'+originBadge(req)+statusBadge(req.id)+'</div><h3 id="active-thread-title">'+esc(req.title)+'</h3><p>'+esc(req.summary)+'</p>'+req.fields.slice(0,3).map(f=>'<div class="field"><h3>'+esc(f.label)+'</h3><p>'+esc(f.value)+'</p></div>').join("")+'<button class="btn primary" data-thread-item="'+req.id+'">審閱這條需求 · 查看完整說明</button></div></section>'+
 '<section class="thread-column rules"><h2>適用的業務約定 <span class="badge amber">'+edgesFor(req.id,"agreements").length+'</span></h2><div class="rules-list">'+relationGroup(req.id,"agreements","尚未建立適用約定的關聯，需要核對。")+'</div></section></div>'+
 '<div class="thread-lower"><section class="thread-section"><h2>圍繞這條需求的溝通 <span class="badge">'+edgesFor(req.id,"communications").length+'</span></h2>'+relationGroup(req.id,"communications","尚未建立溝通記錄關聯。")+'</section><section class="thread-section"><h2>還需要對齊什麼 <span class="badge amber">'+edgesFor(req.id,"questions").length+'</span></h2>'+relationGroup(req.id,"questions","本次尚未列出關聯的待確認事項。")+'</section></div>'+
 '<section class="thread-section thread-materials"><h2>涉及的資料現狀 <span class="badge">'+edgesFor(req.id,"materials").length+'</span></h2><div class="material-links">'+relationGroup(req.id,"materials","本次尚未列出相關資料現狀。")+'</div></section><p class="thread-proof">關聯說明依據資料內容整理，可點擊編號核對依據。審閱一條需求不會自動確認它關聯的約定和待確認事項。</p>';
}
function showThreadItem(id){
 const item=byId.get(id);if(!item)return;
 $("thread-item-title").textContent=CATEGORIES[item.category].title;
 $("thread-item-context").textContent="當前需求："+(byId.get(state.threadId)?.title||"未選擇");
 const edge=edgesFor(state.threadId).find(e=>e.target===id);
 $("thread-item-content").dataset.itemId=id;
 $("thread-item-content").innerHTML=(edge?'<p class="view-note" style="margin:20px 25px 0">關聯原因：'+esc(edge.reason)+'</p>':"")+detailMarkup(item,"thread-review-comment");
 bindReviewComment($("thread-item-content"),id);
 showDialog("thread-item-dialog");
}
function showThreadDocument(id){
 const group=threadDocuments(state.threadId).find(g=>g.document.id===id);if(!group)return;
 showSource(group.sections[0].id);
 $("source-subtitle").textContent="當前需求："+byId.get(state.threadId).title+" · "+group.sections.length+" 個關聯條目";
 $("source-content").innerHTML='<div class="doc-actions"><span class="badge">'+esc(group.document.filename)+'</span><button class="btn" data-doc="'+esc(id)+'">查看本文全部條目</button></div>'+
 '<div id="thread-source-relations">'+threadLinks(requirements.filter(r=>threadDocuments(r.id).some(g=>g.document.id===id)),"這份文件還關聯")+'</div>'+group.sections.map(sectionHtml).join("");
}
function overview(){
 const reqs=DATA.items.filter(i=>i.category==="requirements");
 const questions=DATA.items.filter(i=>i.category==="questions");
 const commDocs=DATA.documents.filter(d=>d.type==="溝通記錄");
 const reviewed=DATA.items.filter(i=>currentReview(i.id).status!=="unreviewed").length;
 const tiles=[["來源文檔",DATA.documents.length,"需求 · 約定 · 溝通記錄","sources"],["功能提煉",reqs.length,"供業務人員逐項審閱","requirements"],["業務約定",count("agreements"),"保留條件與責任邊界","agreements"],["溝通文檔",commDocs.length,"按已提供的文檔計數","communications"]];
 $("main").innerHTML=heading(DATA.project.title,DATA.project.subtitle,"資料截止 "+DATA.project.as_of)+
 '<section class="hero"><div><div class="eyebrow">共同對齊的目標</div><h2>'+esc(DATA.project.summary)+'</h2><p>'+esc(DATA.project.scope)+'</p></div><div class="hero-side"><strong>先看清，再逐項確認</strong><p>'+esc(DATA.project.review_note)+'</p></div></section>'+
 '<div class="stats">'+tiles.map(t=>'<button class="stat" data-stat="'+t[3]+'"><small>'+t[0]+'</small><strong>'+t[1]+'</strong><span>'+t[2]+'</span></button>').join("")+'</div>'+
 '<div class="overview-grid"><section><div class="section-heading"><h2>客戶希望先做到什麼</h2><button class="text-btn" data-view="requirements">查看全部 →</button></div>'+
 (reqs.length?reqs.map((item,n)=>'<button class="flow-row" data-open="'+item.id+'"><span class="step-num">'+String(n+1).padStart(2,"0")+'</span><span><h3>'+esc(item.title)+'</h3><p>'+esc(item.summary)+'</p></span><span class="row-arrow">↗</span></button>').join(""):'<div class="empty">本次資料尚未提煉客戶需求。</div>')+
 '</section><section><div class="section-heading"><h2>下一次需要對齊</h2><span class="badge amber">'+questions.length+' 項待確認</span></div><div class="question-box">'+(questions.length?questions.slice(0,4).map(i=>'<button class="question-row" data-open="'+i.id+'"><h3>'+esc(i.title)+'</h3><p>'+esc(i.summary)+'</p></button>').join(""):'<div class="question-row">本次資料未列出待確認事項。</div>')+'</div><button class="text-btn" data-view="questions" style="margin-top:10px">查看全部待確認事項 →</button>'+
 '<div class="overview-foot"><strong>本機審閱進度：<span id="overview-reviewed">'+reviewed+'</span> / '+DATA.items.length+' 項</strong><br>資料已記錄的事實與本次審閱意見分別保存。此計數表示閱讀與對齊情況，不表示業務事項已完成。</div></section></div>';
}
function filteredItems(){
 const query=state.query.toLocaleLowerCase();
 let items=DATA.items.filter(i=>i.category===state.view);
 if(state.view==="communications")items=items.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
 return items.filter(i=>(state.filter==="all"||currentReview(i.id).status===state.filter)&&(!query||[i.title,i.summary,i.id,i.origin,...i.fields.map(f=>f.value),...i.references].join(" ").toLocaleLowerCase().includes(query)));
}
function reviewView(){
 const category=CATEGORIES[state.view];
 $("main").innerHTML=heading(category.title,category.description,count(state.view)+" 個審閱事項")+
 (state.view==="materials"?'<p class="view-note">以下現狀來自需求與溝通記錄中的描述，尚未通過連接系統或讀取原始業務數據核實。</p>':state.view==="communications"?'<p class="view-note">訪談記錄與後補案例分別列示。記錄中的業務狀態保留原意，面板右側狀態僅表示本次人工審閱意見。</p>':state.view==="requirements"?'<p class="view-note">功能與完成標準是依據需求的提煉，供本次對齊使用；具體量化指標尚待現狀核實後共同確定。</p>':"")+
 '<div class="toolbar"><label class="search"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="搜索事項、內容或來源編號" aria-label="搜索審閱事項" value="'+esc(state.query)+'"></label><select id="status-filter" aria-label="篩選審閱狀態"><option value="all">全部審閱狀態</option>'+Object.entries(STATUSES).map(([key,value])=>'<option value="'+key+'" '+(state.filter===key?"selected":"")+'>'+value+'</option>').join("")+'</select></div><p class="result-count" id="result-count" aria-live="polite"></p><div class="review-layout"><div id="item-list" class="item-list"></div><article id="detail" class="detail" aria-label="事項詳情"></article></div>';
 renderList();
 $("search-input").addEventListener("input",e=>{state.query=e.target.value;renderList()});
 $("status-filter").addEventListener("change",e=>{state.filter=e.target.value;renderList()});
}
function renderList(){
 const items=filteredItems();
 if(!items.some(i=>i.id===state.selected))state.selected=items[0]?.id||null;
 $("result-count").textContent="顯示 "+items.length+" / "+count(state.view)+" 項";
 $("item-list").innerHTML=items.length?items.map(i=>'<button class="item-card '+(i.id===state.selected?"selected":"")+'" data-select="'+i.id+'" aria-pressed="'+(i.id===state.selected)+'"><div class="card-meta">'+originBadge(i)+statusBadge(i.id)+'</div><h3>'+esc(i.title)+'</h3><p>'+esc(i.summary)+'</p><div class="card-footer"><span>'+(i.date?esc(i.date):i.references.length+" 個來源條目")+'</span><span>'+(currentReview(i.id).comment?"已有評論 · ":"")+"查看詳情 →"+'</span></div></button>').join(""):'<div class="empty"><h3>沒有匹配的事項</h3><p>換個關鍵詞或調整審閱狀態篩選。</p><button class="text-btn" id="clear-filters" style="margin-top:12px">清除篩選</button></div>';
 renderDetail();
}
function renderDetail(){
 const i=byId.get(state.selected);
 if(!i){$("detail").innerHTML='<div class="empty"><h3>選擇一個事項開始審閱</h3><p>查看內容、核對來源，再留下你的意見。</p></div>';return}
 $("detail").innerHTML=detailMarkup(i,"review-comment");
 bindReviewComment($("detail"),i.id);
}
function detailMarkup(i,commentId){
 const r=currentReview(i.id);
 return '<div data-review-id="'+i.id+'"><div class="detail-head"><div class="card-meta">'+originBadge(i)+'<span class="mono muted">'+esc(i.id)+'</span></div><h2>'+esc(i.title)+'</h2><p>'+esc(i.summary)+'</p>'+threadLinks(relatedRequirements(i.id),i.category==="requirements"?"查看這條需求的關聯":"關聯到這些需求")+'</div><div class="detail-body">'+i.fields.map(f=>'<section class="field"><h3>'+esc(f.label)+'</h3><p>'+esc(f.value)+'</p></section>').join("")+
 '<section class="field"><h3>依據與來源 · 點擊查看原文</h3><div class="ref-list">'+i.references.map(ref=>'<button class="ref" data-ref="'+esc(ref)+'">'+esc(ref)+' ↗</button>').join("")+'</div></section></div>'+
 '<div class="review-box"><h3>我的審閱意見</h3><div class="status-buttons" role="group" aria-label="設置審閱狀態">'+Object.entries(STATUSES).map(([key,value])=>'<button class="status-btn '+(key===r.status?"active":"")+'" data-status="'+key+'" aria-pressed="'+(key===r.status)+'">'+value+'</button>').join("")+'</div><label for="'+commentId+'">補充說明或需要修改的地方</label><textarea id="'+commentId+'" data-review-comment maxlength="5000" placeholder="例如：請明確適用範圍，或補充完成標準……">'+esc(r.comment)+'</textarea><p class="hint">自動保存到本機瀏覽器，可導出分享。這裡的“已對齊”不代替業務審批。</p></div></div>';
}
function bindReviewComment(container,id){
 container.querySelector('[data-review-comment]').addEventListener("input",e=>{writeReview(id,{comment:e.target.value});const card=document.querySelector('[data-select="'+id+'"] .card-footer span:last-child');if(card)card.textContent=(e.target.value?"已有評論 · ":"")+"查看詳情 →"});
}
function writeReview(id,patch){
 const next={...currentReview(id),...patch,updated_at:new Date().toISOString()};
 if(next.status==="unreviewed"&&!next.comment.trim())delete state.reviews[id];else state.reviews[id]=next;
 saveReviews();
}
function navigate(view,id=null){
 if(!Object.hasOwn(CATEGORIES,view))return;
 if(view==="threads"){
  if(byId.get(id)?.category==="requirements")state.threadId=id;
  history.replaceState(null,"","#thread="+encodeURIComponent(state.threadId||""));
 }else history.replaceState(null,"",location.pathname+location.search);
 state.view=view;state.selected=id;state.query="";state.filter="all";renderNavigation();
 if(view==="threads")renderThread();else if(view==="overview")overview();else reviewView();
 window.scrollTo({top:0,behavior:"instant"});
}
function showDialog(id){if(!$(id).open)$(id).showModal()}
function showSources(){
 $("source-title").textContent="本次審閱的來源文檔";$("source-subtitle").textContent=DATA.documents.length+" 份規範化資料 · 點擊文檔查看已嵌入的完整條目";
 $("source-content").innerHTML='<div class="document-list">'+DATA.documents.map(d=>'<button class="document-btn" data-doc="'+esc(d.id)+'"><strong>'+esc(d.title)+'</strong><small>'+esc(d.type)+' · '+esc(d.date||"日期未標註")+'</small></button>').join("")+'</div>';
 showDialog("source-dialog");
}
function sectionHtml(s){return '<section class="document-section"><h3>'+esc(s.id+" "+s.title)+'</h3><div class="source-text">'+esc(s.text)+'</div></section>'}
function showSource(ref,full=false){
 const value=byRef.get(ref);if(!value)return;
 const d=value.document;$("source-title").textContent=d.title;$("source-subtitle").textContent=d.type+" · 原記錄日期 "+(d.date||"未標註");
 $("source-content").innerHTML='<div class="doc-actions"><button class="btn" data-sources>全部文檔</button>'+(!full?'<button class="btn" data-doc="'+esc(d.id)+'">查看本文全部條目</button>':"")+'<span class="muted small">保持來源中的日期、條件和確認狀態</span></div>'+(full?d.sections:[value.section]).map(sectionHtml).join("");
 $("source-content").insertAdjacentHTML("afterbegin",'<div id="thread-source-relations">'+threadLinks(requirements.filter(r=>threadDocuments(r.id).some(g=>g.document.id===d.id)),"這份文件關聯")+'</div>');
 $("source-dialog").scrollTop=0;showDialog("source-dialog");
}
function exportRecords(){
 return DATA.items.filter(i=>currentReview(i.id).status!=="unreviewed"||currentReview(i.id).comment.trim()).map(i=>({id:i.id,title:i.title,category:CATEGORIES[i.category].title,origin:i.origin,references:i.references,
  related_requirements:relatedRequirements(i.id).map(r=>({id:r.id,title:r.title})),
  documents:(i.category==="requirements"?threadDocuments(i.id).map(g=>g.document):DATA.documents.filter(d=>d.sections.some(s=>i.references.includes(s.id)))).map(d=>({id:d.id,filename:d.filename||d.title})),
  related_agreements:edgesFor(i.id,"agreements").map(e=>({id:e.target,title:byId.get(e.target).title,reason:e.reason,references:e.references})),
  ...currentReview(i.id),status_label:STATUSES[currentReview(i.id).status]}));
}
function exportPayload(){const reviews=exportRecords(),ids=new Set(reviews.map(r=>r.id));return {schema_version:1,project:DATA.project.id,title:DATA.project.title,revision:DATA.revision,relationship_revision:DATA.relationship_revision,as_of:DATA.project.as_of,exported_at:new Date().toISOString(),notice:"人工審閱意見；不修改來源中的業務批准或事實狀態。關聯說明為依據資料的整理，不因事項已對齊而自動獲得確認。",sources:DATA.documents.map(d=>({id:d.id,filename:d.filename,sha256:d.sha256})),relationships:RELATIONSHIPS.filter(e=>ids.has(e.requirement)||ids.has(e.target)),reviews}}
function markdownFeedback(){
 const records=exportRecords();
 let text="# "+DATA.project.title+" · 審閱意見\n\n資料截止："+DATA.project.as_of+"\n資料版本："+DATA.revision+"\n\n請根據以下人工意見核對並修訂相關需求資料。保留來源、適用條件和業務確認狀態；審閱意見不代替業務批准。\n";
 if(!records.length)return text+"\n尚未填寫審閱意見。\n";
 records.forEach(r=>{text+="\n## "+r.id+" "+r.title+"\n\n- 分類："+r.category+"\n- 審閱狀態："+r.status_label+"\n- 內容性質："+r.origin+"\n- 相關需求："+(r.related_requirements.map(x=>x.id+" "+x.title).join("；")||"尚未建立關聯")+"\n- 對應文件："+r.documents.map(d=>d.filename).join("；")+"\n- 來源："+r.references.join("、")+"\n- 記錄時間："+r.updated_at+"\n\n"+(r.comment||"未填寫補充說明。")+"\n";if(r.related_agreements.length)text+="\n關聯約定（按資料整理）：\n"+r.related_agreements.map(a=>"- "+a.title+"："+a.reason+"（"+a.references.join("、")+"）").join("\n")+"\n"});
 return text;
}
function showExport(){$("export-preview").textContent=markdownFeedback();showDialog("export-dialog")}
function download(format){
 const payload=exportPayload(), name=DATA.project.id+"-review-"+new Date().toISOString().slice(0,10);
 const text=format==="json"?JSON.stringify(payload,null,2):markdownFeedback();
 const blob=new Blob([text],{type:format==="json"?"application/json;charset=utf-8":"text/markdown;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=name+"."+(format==="json"?"json":"md");document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify("已導出 "+payload.reviews.length+" 項審閱記錄");
}
async function copyFeedback(){
 const text=markdownFeedback();
 try{
  if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text)}
  else {const area=document.createElement("textarea");area.value=text;area.style.position="fixed";area.style.opacity="0";$("export-dialog").appendChild(area);area.select();const copied=document.execCommand("copy");area.remove();if(!copied)throw new Error("copy")}
  notify("修訂意見已複製");
 }catch{notify("複製未成功，請下載 Markdown 文件")}
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.view){navigate(b.dataset.view)}
 else if(b.dataset.thread){for(const id of ["source-dialog","thread-item-dialog"])if($(id).open)$(id).close();navigate("threads",b.dataset.thread)}
 else if(b.dataset.threadItem){showThreadItem(b.dataset.threadItem)}
 else if(b.dataset.threadDoc){showThreadDocument(b.dataset.threadDoc)}
 else if(b.dataset.stat){b.dataset.stat==="sources"?showSources():navigate(b.dataset.stat)}
 else if(b.dataset.open){const i=byId.get(b.dataset.open);navigate(i.category==="requirements"?"threads":i.category,i.id)}
 else if(b.dataset.select){state.selected=b.dataset.select;renderList();if(window.innerWidth<1100)$("detail").scrollIntoView({behavior:"smooth",block:"start"})}
 else if(b.dataset.status){const id=b.closest('[data-review-id]')?.dataset.reviewId;if(id){writeReview(id,{status:b.dataset.status});if(state.view==="threads"){renderThread();showThreadItem(id)}else renderList()}}
 else if(b.dataset.ref){showSource(b.dataset.ref)}
 else if(b.dataset.doc){const d=DATA.documents.find(d=>d.id===b.dataset.doc);if(d)showSource(d.sections[0].id,true)}
 else if(b.hasAttribute("data-sources")){showSources()}
 else if(b.dataset.close){$(b.dataset.close).close()}
 else if(b.id==="clear-filters"){state.query="";state.filter="all";reviewView()}
});
$("sources-button").addEventListener("click",showSources);
$("export-button").addEventListener("click",showExport);
$("download-md").addEventListener("click",()=>download("md"));
$("download-json").addEventListener("click",()=>download("json"));
$("copy-feedback").addEventListener("click",copyFeedback);
if(!state.storageAvailable){$("save-message").textContent="無法讀取保存，請導出意見";$("save-message").classList.add("warning")}
function openThreadFromLocation(){const id=new URLSearchParams(location.hash.slice(1)).get("thread");if(byId.get(id)?.category==="requirements")state.threadId=id;navigate("threads",state.threadId)}
window.addEventListener("hashchange",openThreadFromLocation);
openThreadFromLocation();
</script>
</body>
</html>
